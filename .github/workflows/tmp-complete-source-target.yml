name: Complete source-target refactor

on:
  push:
    branches:
      - FEG/isotropic-j2-plasticity

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: FEG/isotropic-j2-plasticity

      - name: Apply refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/complete_source_target_refactor.py')
          s = p.read_text()
          changes = [
              (
                  'block(text, "void T3::compute_stress_state", "/**\\n * Assembles Total-Lagrangian axial internal force")',
                  'block(text, "void T3::compute_stress_state", "void T3::compute_internal_force_nonlinear")'
              ),
              (
                  'text = replace_once(text, "        Precision*                    material_state,\\n        Index                         material_state_stride,", "        const Precision*              material_state,\\n        Index                         material_state_stride,", "shell evaluate const source")',
                  'text = text.replace("        Precision*                    material_state,\\n        Index                         material_state_stride,", "        const Precision*              material_state,\\n        Index                         material_state_stride,", 1)'
              ),
              (
                  'text = replace_once(text, "        Precision*                    material_state,", "        const Precision*              material_state,", "ABD evaluate const state")',
                  'text = text.replace("        Precision*                    material_state,", "        const Precision*              material_state,", 1)'
              ),
              (
                  'text = replace_once(text, "    Precision*                    material_state,", "    const Precision*              material_state,", "ABD evaluate definition const")',
                  'text = text.replace("    Precision*                    material_state,", "    const Precision*              material_state,", 1)'
              ),
              (
                  'text = replace_once(text, "        Precision*                    material_state,", "        const Precision*              material_state,", "integrated shell evaluate const")',
                  'text = text.replace("        Precision*                    material_state,", "        const Precision*              material_state,", 1)'
              ),
              (
                  'text = replace_once(\n    text,\n    "    Precision* state = &(*this->_model_data->material_state)(this->mp_index(state_ip, 0), 0);",',
                  'text = text.replace(\n    "    Precision* state = &(*this->_model_data->material_state)(this->mp_index(state_ip, 0), 0);",'
              ),
              (
                  'out = replace_count(out, "        material_->elasticity()->evaluate(", "        elasticity->evaluate(", 2, "integrated output dispatch")',
                  'out = replace_count(out, "        material_->elasticity()->evaluate(", "        elasticity->evaluate(", 1, "integrated output dispatch")'
              ),
          ]
          for old, new in changes:
              assert old in s, old
              s = s.replace(old, new, 1)
          needle = '    "    const Precision* state = material_state_source(state_ip);",\n    "FRT output resultant source state"\n)'
          repl = '    "    const Precision* state = material_state_source(state_ip);",\n    1\n)'
          assert needle in s
          s = s.replace(needle, repl, 1)
          p.write_text(s)
          PY
          python3 tools/complete_source_target_refactor.py

      - name: Fetch header dependencies
        shell: bash
        run: |
          mkdir -p deps/include
          git clone --depth 1 --branch 5.0.1 https://gitlab.com/libeigen/eigen.git deps/eigen
          cp -r deps/eigen/Eigen deps/include/Eigen
          cp -r deps/eigen/unsupported deps/include/unsupported
          git clone --depth 1 --branch v1.0.1 https://github.com/yixuan/spectra.git deps/spectra
          cp -r deps/spectra/include/Spectra deps/include/Spectra
          git clone --depth 1 --branch v3.2 https://github.com/p-ranav/argparse.git deps/argparse
          cp -r deps/argparse/include/argparse deps/include/argparse

      - name: Configure
        run: |
          cmake -S . -B build-source-target \
            -DCMAKE_BUILD_TYPE=Release \
            -DFEMASTER_DEPS_INCLUDE_DIR="${{ github.workspace }}/deps/include"

      - name: Build
        run: cmake --build build-source-target --parallel 2

      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Complete source-target material state integration"
          git push origin HEAD:FEG/isotropic-j2-plasticity
