name: Python API

on:
  push:
    paths:
      - "femaster_api/**"
      - ".github/workflows/python-api.yml"
  pull_request:
    paths:
      - "femaster_api/**"
      - ".github/workflows/python-api.yml"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FEMaster
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python API
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./femaster_api

      - name: Run Python API tests
        working-directory: femaster_api
        run: python -m pytest -q
