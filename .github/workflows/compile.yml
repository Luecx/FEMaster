name: Build — Cross-Platform

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to compile
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

permissions:
  contents: read

jobs:
  compile-linux:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FEMaster
        uses: actions/checkout@v4

      - name: Install Intel oneAPI MKL
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build wget gpg

          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | \
            sudo tee /etc/apt/sources.list.d/oneAPI.list

          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel intel-oneapi-openmp

      - name: Configure Linux MKL OpenMP
        shell: bash
        run: |
          set -o pipefail
          source /opt/intel/oneapi/setvars.sh

          cmake --preset linux-mkl-omp \
            2>&1 | tee compile-linux-configure.log

      - name: Compile Linux MKL OpenMP
        shell: bash
        run: |
          set -o pipefail
          source /opt/intel/oneapi/setvars.sh
          cmake --build --preset linux-mkl-omp \
            2>&1 | tee compile-linux-build.log

      - name: Upload Linux executable and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-linux
          path: |
            build/linux-mkl-omp/bin/
            compile-linux-configure.log
            compile-linux-build.log
          if-no-files-found: warn
          retention-days: 14

  compile-windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest

    steps:
      - name: Checkout FEMaster
        uses: actions/checkout@v4

      - name: Install Intel oneAPI Base Toolkit
        shell: pwsh
        run: |
          winget source update
          winget install -e --id Intel.OneAPI.BaseToolkit --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

          if (!(Test-Path "C:\Program Files (x86)\Intel\oneAPI\setvars.bat")) {
            Write-Error "Intel oneAPI setvars.bat was not found."
            exit 1
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Windows Intel MKL OpenMP
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          cmake --preset windows-intel-mkl-omp > compile-windows-configure.log 2>&1
          set "status=%ERRORLEVEL%"
          type compile-windows-configure.log
          exit /b %status%

      - name: Compile Windows Intel MKL OpenMP
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat"
          cmake --build --preset windows-intel-mkl-omp > compile-windows-build.log 2>&1
          set "status=%ERRORLEVEL%"
          type compile-windows-build.log
          exit /b %status%

      - name: Upload Windows executable and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-windows
          path: |
            build/windows-intel-mkl-omp/bin/
            compile-windows-configure.log
            compile-windows-build.log
          if-no-files-found: warn
          retention-days: 14

  compile-macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15

    steps:
      - name: Checkout FEMaster
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        shell: bash
        run: brew install libomp ninja

      - name: Configure macOS OpenMP Accelerate
        shell: bash
        run: |
          set -o pipefail
          LIBOMP_PREFIX="$(brew --prefix libomp)"

          cmake --preset macos-omp-accelerate \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="${LIBOMP_PREFIX}" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${LIBOMP_PREFIX}/lib/libomp.dylib" \
            2>&1 | tee compile-macos-configure.log

      - name: Compile macOS OpenMP Accelerate
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset macos-omp-accelerate \
            2>&1 | tee compile-macos-build.log

      - name: Upload macOS executable and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-macos
          path: |
            build/macos-omp-accelerate/bin/
            compile-macos-configure.log
            compile-macos-build.log
          if-no-files-found: warn
          retention-days: 14
