name: Temporary C3D13 schematic regeneration

on:
  push:
    branches:
      - FEG/fix-c3d13-surface-sides
    paths:
      - .github/workflows/_temporary_regenerate_c3d13.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: FEG/fix-c3d13-surface-sides
          fetch-depth: 1

      - name: Prepare image generator dependencies
        run: |
          python -m pip install numpy matplotlib pillow

      - name: Regenerate tracked C3D13 schematic
        run: |
          cd documentation/pages/figures/element_schematics
          MPLBACKEND=Agg python generate.py --element C3D13 --out .

      - name: Commit regenerated schematic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentation/pages/figures/element_schematics/c3d13_schematic.png
          if git diff --cached --quiet; then
            echo "Schematic already current."
          else
            git commit -m "Regenerate C3D13 schematic after adding surface sides"
            git push origin HEAD:FEG/fix-c3d13-surface-sides
          fi
