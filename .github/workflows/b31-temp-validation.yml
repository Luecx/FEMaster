name: B31 temporary validation

on:
  push:
    branches:
      - feat/b31-geometrically-exact-beam

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/b31-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DFEMASTER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/b31-ci --parallel 2
      - name: Test
        run: ctest --test-dir build/b31-ci --output-on-failure
